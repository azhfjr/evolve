<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Board Room · Evolve — Interactive design mockup</title>
    <style>
      @font-face {
        font-family: Inter;
        src: url("./inter.woff2");
      }
      @font-face {
        font-family: Manrope;
        src: url("./manrope.woff2");
      }
      :root {
        --bg: #fafaf8;
        --surface: #fff;
        --side: #f6f6f3;
        --ink: #292d2a;
        --muted: #626d59;
        --border: #e9eae5;
        --green: #416b52;
        --green-soft: #edf3ed;
        --purple: #7d68bd;
        --amber: #b77740;
        --radius: 12px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          13px Inter,
          Arial,
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a,
      input,
      select {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      button {
        border: 0;
        background: none;
      }
      button:disabled {
        cursor: default;
        opacity: 0.5;
      }
      a {
        color: var(--green);
        text-decoration: none;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #8aab95;
        outline-offset: 3px;
      }
      button:hover {
        background-color: #edf0e9;
      }
      input,
      select {
        border: 1px solid #dcdfd5;
        background: #fff;
        border-radius: 7px;
        color: var(--ink);
        padding: 9px 11px;
        min-height: 36px;
      }
      input[type="search"] {
        width: 240px;
      }
      svg {
        vertical-align: middle;
        flex-shrink: 0;
      }
      .app {
        display: grid;
        grid-template-columns: 204px minmax(0, 1fr);
        min-height: 100vh;
      }
      .sidebar {
        background: var(--side);
        border-right: 1px solid var(--border);
        padding: 28px 16px;
        display: flex;
        flex-direction: column;
        position: fixed;
        width: 204px;
        height: 100vh;
        z-index: 20;
      }
      .brand {
        font:
          750 23px Manrope,
          Arial;
        letter-spacing: -1px;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 10px;
      }
      .brand-mark {
        display: grid;
        grid-template-columns: repeat(2, 7px);
        gap: 3px;
        transform: rotate(-8deg);
      }
      .brand-mark i {
        width: 7px;
        height: 7px;
        background: var(--green);
        border-radius: 2px;
      }
      .brand-mark i:last-child {
        opacity: 0.35;
      }
      .workspace {
        font-size: 11px;
        color: var(--muted);
        padding: 13px 10px 0;
        line-height: 1.7;
      }
      .app-name {
        border-top: 1px solid var(--border);
        padding: 25px 10px 12px;
        margin-top: 20px;
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 650;
      }
      .room-icon {
        width: 29px;
        height: 29px;
        border-radius: 8px;
        background: #e3ebdf;
        color: var(--green);
        display: grid;
        place-items: center;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .nav button {
        padding: 11px 12px;
        border-radius: 7px;
        text-align: left;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .nav button.active {
        background: #e5ece2;
        color: #345742;
        font-weight: 600;
      }
      .nav .num {
        margin-left: auto;
        background: #d4e0d0;
        border-radius: 4px;
        padding: 2px 5px;
        font-size: 10px;
      }
      .side-note {
        margin-top: auto;
        padding: 16px 10px;
        border-bottom: 1px solid var(--border);
        color: var(--muted);
        font-size: 11px;
        line-height: 1.7;
      }
      .side-note b {
        display: block;
        color: var(--ink);
        font-weight: 550;
      }
      .profile {
        padding: 17px 8px 0;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .avatar {
        width: 31px;
        height: 31px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #e3e7da;
        color: #476044;
        font-weight: 650;
      }
      .profile small {
        display: block;
        color: var(--muted);
        font-size: 10px;
        margin-top: 4px;
      }
      .main {
        grid-column: 2;
        min-width: 0;
      }
      .topbar {
        height: 62px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 34px;
        background: #ffffffa8;
        gap: 12px;
      }
      .breadcrumb {
        color: var(--muted);
        display: flex;
        gap: 13px;
        align-items: center;
        font-size: 12px;
      }
      .breadcrumb span:last-child {
        color: var(--ink);
      }
      .demo-badge {
        font-size: 10px;
        border: 1px solid #dce1d4;
        background: #f2f5ec;
        border-radius: 5px;
        padding: 5px 8px;
        color: #59694a;
      }
      .top-actions {
        display: flex;
        gap: 13px;
        align-items: center;
      }
      .role-switch {
        font-size: 11px;
        color: var(--muted);
        padding: 6px;
        border-radius: 4px;
      }
      .content {
        max-width: 1850px;
        margin: auto;
        padding: 31px 34px 36px;
      }
      .page-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        margin-bottom: 23px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font:
          750 31px Manrope,
          Arial;
        letter-spacing: -1.2px;
      }
      h2 {
        font:
          700 17px Manrope,
          Arial;
        letter-spacing: -0.35px;
      }
      h3 {
        font:
          650 13px Inter,
          Arial;
      }
      p.subtitle {
        color: var(--muted);
        font-size: 12px;
        margin-top: 9px;
        line-height: 1.6;
      }
      .heading-actions {
        display: flex;
        gap: 8px;
      }
      .button {
        min-height: 36px;
        padding: 8px 12px;
        border: 1px solid #dcdfd5;
        background: #fff;
        border-radius: 7px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        font-size: 12px;
      }
      .button.primary {
        background: var(--green);
        color: white;
        border-color: var(--green);
      }
      .button.primary:hover {
        background: #345742;
      }
      .button.small {
        min-height: 30px;
        padding: 6px 9px;
        font-size: 11px;
      }
      .section-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 600;
      }
      .section-label .subtle {
        font-weight: 400;
        color: var(--muted);
        font-size: 11px;
      }
      .stage-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .text-button {
        color: var(--green);
        font-size: 11px;
        padding: 5px;
      }
      .stages {
        display: grid;
        grid-template-columns: repeat(10, minmax(0, 1fr));
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 10px;
        margin-bottom: 20px;
        overflow: hidden;
      }
      .stage-card {
        text-align: left;
        padding: 15px 12px 13px;
        border-right: 1px solid var(--border);
        position: relative;
        min-width: 0;
      }
      .stage-card:last-child {
        border: 0;
      }
      .stage-card.active {
        background: var(--green-soft);
        box-shadow: inset 0 -3px var(--green);
      }
      .stage-card .stage-pos {
        display: flex;
        align-items: center;
        gap: 5px;
        color: #7b8573;
        font-size: 10px;
        margin-bottom: 12px;
      }
      .stage-card .stage-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #a7b9a0;
      }
      .stage-card strong {
        font: 650 24px Manrope;
        letter-spacing: -0.7px;
        display: block;
      }
      .stage-card .stage-name {
        font-size: 10px;
        color: var(--muted);
        display: block;
        margin-top: 5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 0 0 15px;
        flex-wrap: wrap;
      }
      .filters {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .searchbox {
        position: relative;
      }
      .searchbox svg {
        position: absolute;
        top: 11px;
        left: 10px;
        color: #7d8676;
      }
      .searchbox input {
        padding-left: 33px;
        font-size: 11px;
      }
      .filters select {
        font-size: 11px;
        max-width: 165px;
        padding: 8px;
      }
      .filter-reset {
        font-size: 11px;
        color: var(--green);
        padding: 9px 3px;
      }
      .result-count {
        color: var(--muted);
        font-size: 11px;
      }
      .result-count strong {
        color: var(--ink);
        font-weight: 600;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .timeline-head {
        padding: 19px 20px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .panel-subtitle {
        font-size: 11px;
        color: var(--muted);
        margin-top: 6px;
      }
      .timeline-controls {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .segmented {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 3px;
        display: flex;
      }
      .segmented button {
        padding: 5px 9px;
        border-radius: 4px;
        font-size: 10px;
        color: var(--muted);
      }
      .segmented button.active {
        background: #edf1e9;
        color: #395840;
        font-weight: 600;
      }
      .legend {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 10px;
        color: var(--muted);
      }
      .legend span {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .legend i,
      .cat-dot {
        height: 6px;
        width: 6px;
        border-radius: 50%;
        display: inline-block;
        background: var(--c);
        flex-shrink: 0;
      }
      .timeline-scroll {
        overflow: auto;
        max-height: 560px;
        scrollbar-width: thin;
        scrollbar-color: #d5dbce transparent;
      }
      .timeline-grid {
        min-width: 920px;
      }
      .time-header,
      .project-row {
        display: grid;
        grid-template-columns: 290px minmax(0, 1fr);
      }
      .time-header {
        position: sticky;
        top: 0;
        background: #f8f9f5;
        z-index: 5;
        border-block: 1px solid var(--border);
        height: 39px;
      }
      .time-header .project-col {
        font-size: 10px;
        display: flex;
        align-items: center;
        gap: 5px;
        color: var(--muted);
        background: #f8f9f5;
      }
      .project-col {
        padding: 0 17px;
        position: sticky;
        left: 0;
        background: #fff;
        z-index: 3;
        border-right: 1px solid var(--border);
        min-width: 0;
      }
      .years {
        display: grid;
        grid-template-columns: repeat(var(--years), minmax(0, 1fr));
      }
      .year-label {
        display: grid;
        place-items: center;
        font-size: 10px;
        color: #6e7765;
        border-right: 1px solid #e9eae5;
        cursor: pointer;
      }
      .year-label.current {
        color: var(--green);
        font-weight: 700;
        background: #eaf0e7;
      }
      .project-row {
        height: 57px;
        border-bottom: 1px solid #eff0eb;
        cursor: pointer;
      }
      .project-row:hover .project-col {
        background: #f5f8f2;
      }
      .project-row.open .project-col {
        background: #f1f6ee;
      }
      .project-row .project-col {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        text-align: left;
      }
      .chevron {
        color: #a3ab9b;
        transition: transform 0.15s;
      }
      .open .chevron {
        transform: rotate(90deg);
        color: var(--green);
      }
      .project-title {
        font-size: 11px;
        font-weight: 550;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 214px;
      }
      .project-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #7b8372;
        font-size: 9px;
        margin-top: 5px;
      }
      .valid-mark {
        margin-left: auto;
        color: #56865c;
        display: flex;
        align-items: center;
        font-size: 10px;
      }
      .schedule {
        position: relative;
        display: grid;
        grid-template-columns: repeat(var(--years), minmax(0, 1fr));
        min-width: 0;
      }
      .year-cell {
        border-right: 1px solid #f0f1ec;
        height: 100%;
      }
      .range {
        position: absolute;
        left: var(--left);
        width: var(--width);
        height: 23px;
        top: 17px;
        border-radius: 4px;
        background: color-mix(in srgb, var(--c) 10%, white);
        border: 1px solid color-mix(in srgb, var(--c) 19%, white);
        display: flex;
        align-items: center;
        padding: 0 9px;
        color: var(--c);
        font-size: 9px;
        white-space: nowrap;
        min-width: 23px;
        gap: 7px;
      }
      .range::before {
        content: "";
        height: 6px;
        width: 6px;
        border-radius: 2px;
        background: var(--c);
        flex-shrink: 0;
      }
      .cod-marker {
        position: absolute;
        right: -5px;
        top: 6px;
        transform: rotate(45deg);
        width: 9px;
        height: 9px;
        background: var(--c);
        border: 2px solid white;
        border-radius: 1px;
        box-shadow: 0 0 0 1px var(--c);
      }
      .range-label {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .detail {
        padding: 18px 23px 20px;
        background: #f6f8f3;
        border-bottom: 1px solid #dfe6d9;
      }
      .detail-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }
      .detail-info {
        display: flex;
        gap: 22px;
        flex-wrap: wrap;
        font-size: 11px;
      }
      .detail-info small {
        display: block;
        color: var(--muted);
        font-size: 9px;
        margin-bottom: 5px;
      }
      .tag {
        padding: 3px 6px;
        border-radius: 4px;
        background: #e8eee1;
        color: #657a50;
        font-size: 9px;
        display: inline-block;
        margin-right: 4px;
      }
      .stage-track {
        display: grid;
        grid-template-columns: repeat(10, minmax(0, 1fr));
        gap: 5px;
        margin: 16px 0;
      }
      .track-step {
        padding: 8px 5px;
        border: 1px solid #dce3d5;
        border-radius: 5px;
        background: #fff;
        color: #8b9482;
        text-align: left;
        font-size: 9px;
        min-width: 0;
      }
      .track-step b {
        display: block;
        font-size: 10px;
        margin-bottom: 5px;
      }
      .track-step span {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: block;
      }
      .track-step.done {
        background: #e1ebdb;
        border-color: #d4e2cb;
        color: #5d7951;
      }
      .track-step.current {
        background: var(--green);
        color: #fff;
        border-color: var(--green);
      }
      .detail-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .document-status {
        font-size: 10px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 7px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 500;
        white-space: nowrap;
      }
      .status.valid {
        background: #e7f1e3;
        color: #527647;
      }
      .status.review {
        background: #faf0dd;
        color: #9b783c;
      }
      .status.none {
        background: #f1f2ee;
        color: #828b79;
      }
      .timeline-footer {
        padding: 12px 19px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
        font-size: 10px;
        border-top: 1px solid var(--border);
      }
      .marker-key {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .marker-key i {
        width: 6px;
        height: 6px;
        background: #6e8b61;
        transform: rotate(45deg);
      }
      .lower-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 330px;
        gap: 18px;
        margin-top: 20px;
      }
      .panel-heading {
        padding: 19px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
      }
      table {
        border-collapse: collapse;
        width: 100%;
        text-align: left;
        font-size: 11px;
      }
      th {
        font-size: 9px;
        color: var(--muted);
        font-weight: 500;
        background: #fafbf8;
        padding: 11px 15px;
        border-bottom: 1px solid var(--border);
      }
      td {
        padding: 13px 15px;
        border-bottom: 1px solid #eff0eb;
        white-space: nowrap;
      }
      tbody tr:last-child td {
        border: 0;
      }
      th button {
        font-size: 9px;
        color: var(--muted);
        padding: 0;
      }
      td .project-link {
        padding: 0;
        text-align: left;
        font-size: 11px;
        font-weight: 500;
      }
      .table-wrap {
        overflow: auto;
      }
      .category-label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        color: #69735f;
      }
      .stage-chip {
        color: #5b7052;
        background: #f0f4eb;
        padding: 4px 6px;
        border-radius: 4px;
        font-size: 9px;
      }
      .validation-body {
        padding: 20px;
      }
      .donut-section {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 23px;
      }
      .donut {
        width: 105px;
        height: 105px;
        border-radius: 50%;
        background: conic-gradient(
          var(--green) 0deg var(--valid-angle),
          #edf0e8 var(--valid-angle) 360deg
        );
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .donut-hole {
        width: 80px;
        height: 80px;
        background: #fff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }
      .donut-hole strong {
        font: 700 23px Manrope;
        letter-spacing: -0.8px;
      }
      .donut-hole small {
        color: var(--muted);
        font-size: 9px;
        margin-top: 3px;
      }
      .valid-description strong {
        font: 700 24px Manrope;
        letter-spacing: -0.6px;
      }
      .valid-description p {
        font-size: 10px;
        color: var(--muted);
        margin-top: 4px;
        line-height: 1.7;
      }
      .category-bars {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      .category-bar {
        padding: 0;
        width: 100%;
        text-align: left;
      }
      .bar-label {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        margin-bottom: 6px;
      }
      .bar-label span:last-child {
        color: var(--muted);
        font-size: 9px;
      }
      .bar-track {
        height: 5px;
        border-radius: 10px;
        background: #edf0e8;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        background: var(--green);
        border-radius: 10px;
      }
      .chart-foot {
        margin-top: 21px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 9px;
        line-height: 1.6;
      }
      .chart-legend {
        display: flex;
        gap: 13px;
        margin-bottom: 7px;
      }
      .chart-legend span {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .chart-legend i {
        height: 5px;
        width: 5px;
        background: var(--green);
        border-radius: 50%;
      }
      .chart-legend span:last-child i {
        background: #dce3d5;

        `<span class="status ${status(p)}">${p.valid ? icon("check", 11) : p.files ? "◷" : "−"} ${statusLabel(p)}</span>`;
      function filtered(ignoreYear = false) {
        return projects
          .filter(
            (p) =>
              (!state.search ||
                [p.name, p.id, p.location, p.tags.join(" ")].some((x) =>
                  x.toLowerCase().includes(state.search.toLowerCase()),
                )) &&
              (!state.category || p.category === state.category) &&
              (!state.custom || p.tags.includes(state.custom)) &&
              (!state.valid ||
                (state.valid === "valid"
                  ? p.valid
                  : state.valid === "not-valid"
                    ? !p.valid
                    : status(p) === state.valid)) &&
              (state.stage === null || p.stage === state.stage) &&
              (ignoreYear ||
                !state.year ||
                (state.year === "unknown"
                  ? p.cod === null
                  : p.cod === +state.year)),
          )
          .sort(
            (a, b) =>
              (a.cod ?? Infinity) - (b.cod ?? Infinity) ||
              a.id.localeCompare(b.id),
          );
      }
      function notify(message, undo) {
        clearTimeout(toastTimer);
        undoAction = undo || null;
        document.getElementById("toast").innerHTML =
          `<div class="toast">${esc(message)}${undo ? '<button id="undo">Undo</button>' : ""}<button id="dismiss-toast" aria-label="Dismiss notification">${icon("close", 13)}</button></div>`;
        toastTimer = setTimeout(
          () => (document.getElementById("toast").innerHTML = ""),
          6500,
        );
      }
      function toggleStage(n) {
        state.stage = state.stage === n ? null : n;
        render();
      }
      function setProgress(id, n) {
        if (!state.admin) return;
        const p = projects.find((p) => p.id === id),
          old = p.stage,
          wasComplete = p.complete;
        if (old === n && !wasComplete) return;
        p.stage = n;
        p.complete = false;
        preserveRender();
        notify(`${p.name}: ${n ? `stage ${n} of 10` : "not started"}`, () => {
          p.stage = old;
          p.complete = wasComplete;
          render();
          notify("Progress restored");
        });
      }
      function stageSummary(list) {
        const counts = Array.from(
          { length: 10 },
          (_, i) => list.filter((p) => p.stage === i + 1).length,
        );
        return `<div class="stage-heading"><div class="section-label">Projects by stage <span class="subtle">Current position across the filtered portfolio</span></div><button class="text-button" data-stage="0">${list.filter((p) => p.stage === 0).length} not started</button></div><div class="stages">${stageNames.map((s, i) => `<button class="stage-card ${state.stage === i + 1 ? "active" : ""}" data-stage="${i + 1}" title="Filter by ${esc(s)}" aria-pressed="${state.stage === i + 1}"><span class="stage-pos"><span class="stage-dot"></span>Stage ${i + 1}</span><strong>${counts[i]}</strong><span class="stage-name">${esc(s)}</span></button>`).join("")}</div>`;
      }
      function portfolioYears() {
        const years = projects.map((p) => p.cod).filter(Number.isInteger);
        if (!years.length) return Array.from({ length: 8 }, (_, i) => 2026 + i);
        const min = Math.min(...years),
          max = Math.max(...years);
        return Array.from({ length: max - min + 1 }, (_, i) => min + i);
      }
      function yearSummary() {
        const list = filtered(true),
          years = portfolioYears(),
          counts = years.map((y) => list.filter((p) => p.cod === y).length),
          max = Math.max(1, ...counts);
        return `<section class="year-summary" aria-label="Projects by planned COD year"><div class="year-summary-heading"><div class="section-label">Planned COD by year</div><small>Other filters apply · Select a year to focus</small></div><div class="year-blocks">${years.map((y, i) => `<button class="year-block ${state.year === String(y) ? "active" : ""}" data-year-block="${y}" aria-pressed="${state.year === String(y)}" aria-label="${y}: ${counts[i]} projects planned COD"><span class="year-top">${y}<i></i></span><strong>${counts[i]}</strong><small>${counts[i] === 1 ? "project" : "projects"}</small><div class="year-breakdown">${categories.map((c) => `<span class="year-breakdown-row" data-year-category="${y}:${c}"><i class="cat-dot" style="--c:${colors[c]}"></i>${c}<b>${list.filter((p) => p.cod === y && p.category === c).length}</b></span>`).join("")}</div><div class="year-meter"><span style="width:${(counts[i] / max) * 100}%"></span></div></button>`).join("")}</div></section>`;
      }
      function filters() {
        return `<div class="toolbar"><div class="filters"><div class="searchbox">${icon("search", 14)}<input id="search" type="search" placeholder="Search projects or locations…" aria-label="Search projects" value="${esc(state.search)}"></div><select id="category" aria-label="Project category"><option value="">All categories</option>${categories.map((c) => `<option ${state.category === c ? "selected" : ""}>${c}</option>`).join("")}</select><select id="custom" aria-label="Custom category"><option value="">Custom categories</option>${customCategories.map((c) => `<option ${state.custom === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select><select id="validation" aria-label="Document validation"><option value="">All document statuses</option><option value="valid" ${state.valid === "valid" ? "selected" : ""}>Valid</option><option value="not-valid" ${state.valid === "not-valid" ? "selected" : ""}>Not yet valid</option><option value="review" ${state.valid === "review" ? "selected" : ""}>Needs review</option><option value="none" ${state.valid === "none" ? "selected" : ""}>No files</option></select>${state.search || state.category || state.custom || state.valid || state.stage !== null || state.year ? '<button class="filter-reset" id="clear">Clear filters</button>' : ""}</div><div class="result-count"><strong>${filtered().length}</strong> of ${projects.length} projects</div></div>`;
      }
      function detail(p) {
        return `<div class="detail" id="detail-${p.id}" role="region" aria-label="${esc(p.name)} details"><div class="detail-top"><div class="detail-info"><div><small>Capacity</small><b>${p.capacity === null ? "Not set" : p.capacity.toLocaleString("en-US")} ${p.unit}</b></div><div><small>Planned range</small>${p.start ?? "—"}–${p.cod ?? "Not set"}</div><div><small>Custom category</small>${p.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("") || '<span style="color:var(--muted)">None assigned</span>'}</div><div><small>Progress</small>${p.complete ? "Completed" : p.stage ? `Stage ${p.stage} of 10` : "Not started"}</div></div><button class="button small" data-documents="${p.id}">${icon("file", 12)} Project details ${icon("arrow", 12)}</button></div><div class="stage-track">${stageNames.map((s, i) => `<button class="track-step ${i + 1 < p.stage || p.complete ? "done" : i + 1 === p.stage ? "current" : ""}" data-progress="${p.id}:${i + 1}" ${!state.admin ? "disabled" : ""} aria-label="${esc(p.name)}: set stage ${i + 1}, ${esc(s)}" ${p.stage === i + 1 ? 'aria-current="step"' : ""}><b>${i + 1 < p.stage || p.complete ? "✓" : String(i + 1).padStart(2, "0")}</b><span>${esc(s)}</span></button>`).join("")}</div><div class="detail-bottom"><div class="document-status">${badge(p)} <span>${icon("file", 11)} ${p.files} ${p.files === 1 ? "document" : "documents"}</span>${p.links?.length ? `<a href="${esc(p.links[0])}" target="_blank" rel="noopener noreferrer">${icon("link", 11)} Project reference</a>` : ""}</div><div style="display:flex;gap:5px">${state.admin && p.stage ? `<button class="text-button" data-reset="${p.id}">Reset progress</button>` : ""}${state.admin && p.stage === 10 && !p.complete ? `<button class="button small" data-complete="${p.id}">Mark project complete</button>` : ""}${state.admin && p.files && !p.valid ? `<button class="button small" data-documents="${p.id}">Review documents</button>` : ""}</div></div></div>`;
      }
      function timeline(list) {
        const years =
          state.year && state.year !== "unknown"
            ? [+state.year]
            : portfolioYears();
        return `<section class="panel" aria-label="Project portfolio timeline"><div class="timeline-head"><div><h2>Portfolio timeline</h2><p class="panel-subtitle">${state.year ? (state.year === "unknown" ? "COD not set" : `${state.year} focus`) : `${years[0]}–${years[years.length - 1]}`} <span style="padding:0 5px;color:#afb6a5">·</span> Ordered by planned COD</p></div><div class="timeline-controls"><div class="legend">${categories.map((c) => `<span><i style="--c:${colors[c]}"></i>${c}</span>`).join("")}</div><div class="segmented"><button id="all-years" class="${!state.year ? "active" : ""}">All years</button><select id="year" aria-label="Focus on COD year" style="border:0;padding:4px 6px;font-size:10px;min-height:24px;width:91px"><option value="">Focus year</option>${portfolioYears()
          .map(
            (y) =>
              `<option value="${y}" ${+state.year === y ? "selected" : ""}>${y}</option>`,
          )
          .join(
            "",
          )}</select></div></div></div><div class="timeline-scroll"><div class="timeline-grid" style="--years:${years.length};min-width:${Math.max(790, 252 + years.length * 68)}px"><div class="time-header"><div class="project-col">Project <span style="margin-left:auto;font-size:9px">${list.length} projects</span></div><div class="years">${years.map((y) => `<button class="year-label ${y === 2026 ? "current" : ""}" data-year="${y}" aria-label="Focus on ${y}">${y}${y === 2026 ? ' <span style="font-size:7px;margin-top:-8px;font-weight:400">Current year</span>' : ""}</button>`).join("")}</div></div>${
          list.length
            ? list
                .map((p) => {
                  let left =
                    ((Math.max(years[0], p.start ?? p.cod ?? years[0]) -

                })

        }</div></div><div class="timeline-footer"><span>Select a project to expand its details and stage track</span><span class="marker-key"><i></i>Planned COD year</span></div></section>`;
      }
      function table(list) {

            state.sort === "capacity"

        return `<section class="panel"><div class="panel-heading"><div><h2>Project register</h2><p class="panel-subtitle">The detail behind the bigger picture</p></div><button class="text-button" id="export">${icon("download", 12)} Export filtered CSV</button></div><div class="table-wrap"><table><thead><tr><th><button data-sort="name">Project ↕</button></th><th>Category</th><th><button data-sort="capacity">Capacity ↕</button></th><th><button data-sort="cod">COD ↕</button></th><th>Stage</th><th>Documents</th></tr></thead><tbody>${data.map((p) => `<tr><td><button class="project-link" data-documents="${p.id}">${esc(p.name)}</button><div style="font-size:9px;color:#919987;margin-top:4px">${p.id}</div></td><td><span class="category-label"><i class="cat-dot" style="--c:${colors[p.category]}"></i>${p.category}</span></td><td>${p.capacity ?? "—"} <span style="font-size:10px;color:#8a9380">${p.unit}</span></td><td>${p.cod ?? "—"}</td><td><span class="stage-chip">${p.complete ? "Completed" : p.stage ? `${String(p.stage).padStart(2, "0")} ${esc(stageNames[p.stage - 1])}` : "Not started"}</span></td><td>${badge(p)}</td></tr>`).join("") || '<tr><td colspan="6" class="empty">No matching projects</td></tr>'}</tbody></table></div>${state.page !== "database" ? `<div class="timeline-footer"><span>Showing ${list.length} of ${list.length} matching projects</span><button class="text-button" data-nav="database">View database ${icon("arrow", 11)}</button></div>` : ""}</section>`;
      }
      function validation(list) {
        const valid = list.filter((p) => p.valid).length;
        return `<section class="panel"><div class="panel-heading"><div><h2>Document validation</h2><p class="panel-subtitle">Reviewed and marked valid by admin</p></div>${icon("check", 17)}</div><div class="validation-body"><div class="donut-section"><button class="donut" id="valid-chart" style="--valid-angle:${list.length ? (valid / list.length) * 360 : 0}deg" aria-label="Filter ${valid} valid projects"><span class="donut-hole"><strong>${list.length ? Math.round((valid / list.length) * 100) : 0}%</strong><small>valid projects</small></span></button><div class="valid-description"><strong>${valid}<span style="font-size:15px;color:#a3ab98;font-weight:400"> / ${list.length}</span></strong><p>Projects reviewed<br>${list.length - valid} not yet valid</p><button class="text-button" id="not-valid-chart" style="padding:6px 0 0;font-size:10px">View not yet valid ${icon("arrow", 10)}</button></div></div><div class="category-bars">${categories
          .map((c) => {
            const total = list.filter((p) => p.category === c).length,

          })
          .join(
            "",
          )}</div><div class="chart-foot"><div class="chart-legend"><span><i></i>Valid</span><span><i></i>Not yet valid</span></div>Counts reflect all active filters. Uploading files alone does not make a project valid.</div></div></section>`;

            "",
          )}</div></section><section class="panel"><div class="panel-heading"><div><h2>Awaiting document review</h2><p class="panel-subtitle">Select a status to inspect projects</p></div></div><div class="review-counts"><button data-doc-state="review"><strong>${review}</strong><small>Needs review</small></button><button data-doc-state="none"><strong>${noFiles}</strong><small>No files</small></button></div></section>`;

      function dashboard() {

      function documentsPage() {

      function categoriesPage() {
        return `<div class="page-heading"><div><h1>Project categories</h1><p class="subtitle">Three shared primary categories. Your own reusable classifications.</p></div></div><section class="panel"><div class="panel-heading"><div><h2>Primary categories</h2><p class="panel-subtitle">Shared with Locker Room; separate from custom classifications.</p></div></div><div class="category-inventory">${categories.map((c) => `<div class="category-item"><h3><i class="cat-dot" style="--c:${colors[c]}"></i> ${c}</h3><p>${projects.filter((p) => p.category === c).length} sample projects</p></div>`).join("")}</div></section><section class="panel" style="margin-top:16px"><div class="panel-heading"><div><h2>Custom categories</h2><p class="panel-subtitle">Admins create categories and assign several to any project.</p></div></div><div class="category-help">${state.admin ? `<form id="category-form" class="category-form"><label class="field">New custom category<input id="new-category" name="category" required maxlength="45" placeholder="e.g. National strategic project"></label><button class="button primary">${icon("plus", 12)} Add category</button></form>` : ""}<p>Create a category here, then open a project and select it under Custom categories. Categories can also be listed in the project-upload CSV; this mockup does not execute imports.</p></div><div class="category-inventory">${customCategories

          .join("")}</div></section>`;
      }
      function reportsPage() {
        const list = filtered();
        return `<div class="page-heading"><div><h1>Portfolio reports</h1><p class="subtitle">Stage distribution, yearly COD, categories, and document review in one place.</p></div></div>${filters()}${yearSummary()}${stageSummary(list)}<div class="reports-grid">${validation(list)}${portfolioMix(list)}</div>`;
      }
      function database() {
        return `<div class="page-heading"><div><h1>Project database</h1><p class="subtitle">A reliable foundation for your portfolio.</p></div><div class="database-actions"><a class="button" href="project-upload-template.csv" download>${icon("download", 13)} Blank CSV template</a><a class="button primary" href="project-upload-example.csv" download>${icon("download", 13)} Example CSV</a></div></div><div class="notice"><b>Design preview.</b> CSV import is illustrated here; no files are sent to a server and no production data is modified. The finished app will preview and merge by Project ID, preserving projects absent from the upload.</div>${state.admin ? `<section class="panel"><div class="upload-zone">${icon("upload", 27)}<h3>Bring your project list into view</h3><p>Upload → map columns → review changes → merge by Project ID</p><button class="button primary" id="preview-import">Preview example import</button><p style="margin:13px 0 0;font-size:10px">CSV · Planned COD and start year only · Capacity + unit · Custom categories</p></div><div class="template-info"><b>Start with the CSV template.</b> Project ID and Project name identify each record. Category uses <code>Pembangkit</code>, <code>Transmisi</code>, or <code>Gardu Induk</code>. Use <code>YYYY</code> for years, numeric capacity plus its unit, and stage positions <code>1–10</code>. Separate custom categories with semicolons, for example <code>Priority; Renewable</code>. The working importer will preview new custom category names for admin confirmation before creating and assigning them.</div></section>` : ""}<div style="height:22px"></div>${filters()}${table(filtered())}`;
      }
      function settings() {
        return `<div class="page-heading"><div><h1>Make the workflow yours.</h1><p class="subtitle">One shared sequence. Ten stages. Names your team understands.</p></div></div><div class="notice">Stage names below are illustrative, not preset business requirements. Changes are saved in this browser. Use Reset local preview to restore sample data.</div><section class="panel sub-page"><div class="panel-heading"><div><h2>Shared project stages</h2><p class="panel-subtitle">Renaming a stage preserves each project's position.</p></div></div><form id="stage-form"><div class="settings-grid">${stageNames.map((s, i) => `<label class="field">Stage ${String(i + 1).padStart(2, "0")}<input name="stage-${i}" value="${esc(s)}" required maxlength="45" ${!state.admin ? "disabled" : ""}></label>`).join("")}</div><div class="settings-actions"><button class="button primary" ${!state.admin ? "disabled" : ""}>Save stage names</button></div></form></section><section class="panel sub-page" style="margin-top:20px"><div class="panel-heading"><div><h2>Project classifications</h2><p class="panel-subtitle">Primary categories match Locker Room.</p></div></div><div style="padding:20px"><div style="display:flex;gap:10px;margin-bottom:20px">${categories.map((c) => `<span class="status none">${c}</span>`).join("")}</div><h3 style="margin-bottom:12px">Custom categories</h3><div style="display:flex;gap:7px;flex-wrap:wrap">${customCategories.map((c) => `<span class="tag" style="font-size:11px;padding:7px 10px">${esc(c)}</span>`).join("")}</div>${state.admin ? `<form id="category-form" class="category-form"><label class="field">Create a custom category<input id="new-category" name="category" required maxlength="45" placeholder="e.g. National strategic project"></label><button class="button primary">${icon("plus", 12)} Add category</button></form>` : ""}<p style="font-size:11px;color:var(--muted);margin-top:15px">Admins can create reusable custom categories and assign multiple categories to each project from Project details. Primary categories remain Pembangkit, Transmisi, and Gardu Induk.</p></div></section>`;
      }
      function render() {
        document.getElementById("content").innerHTML =
          state.page === "dashboard" || state.page === "portfolio"
            ? dashboard()
            : state.page === "database"
              ? database()
              : state.page === "documents"
                ? documentsPage()
                : state.page === "categories"
                  ? categoriesPage()
                  : state.page === "reports"
                    ? reportsPage()
                    : settings();
        document.getElementById("crumb").textContent = {
          dashboard: "Overview",
          portfolio: "Projects",
          documents: "Documents",
          reports: "Reports",
          categories: "Categories",
          database: "Database",
          settings: "Settings",
        }[state.page];
        document
          .querySelectorAll(".nav [data-nav]")
          .forEach((b) =>
            b.classList.toggle("active", b.dataset.nav === state.page),
          );
        document.getElementById("role").textContent = state.admin
          ? "Viewing as admin ▾"
          : "Viewing as member ▾";
      }
      function preserveRender() {
        const el = document.querySelector(".timeline-scroll"),
          top = el?.scrollTop,
          left = el?.scrollLeft;
        render();
        const after = document.querySelector(".timeline-scroll");
        if (after) {
          after.scrollTop = top || 0;
          after.scrollLeft = left || 0;
        }
      }
      function openDetails(id) {
        const p = projects.find((p) => p.id === id);
        focusBeforeModal = document.activeElement;
        document.getElementById("modal-root").innerHTML =
          `<div class="modal-backdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><div style="color:var(--muted);font-size:10px;margin-bottom:8px">Project details <span style="margin-inline:6px">/</span> ${p.id}</div><h1 id="modal-title" style="font-size:26px">${esc(p.name)}</h1><p class="subtitle">${p.category} · ${esc(p.location)}</p></div><button class="button small" id="close-modal" aria-label="Close project details">${icon("close", 15)}</button></div><div class="modal-body">${detail(p)}<div style="padding:20px 0"><h3>Project information</h3><div class="settings-grid" style="padding:16px 0"><label class="field">Capacity<input id="capacity" type="number" min="0" step="any" value="${p.capacity ?? ""}" ${!state.admin ? "disabled" : ""}></label><label class="field">Capacity unit<select id="capacity-unit" ${!state.admin ? "disabled" : ""}>${["MW", "MVA", "kms", "MWh", "MWp", "MWac", "custom"].map((u) => `<option ${u === p.unit || (u === "custom" && !["MW", "MVA", "kms", "MWh", "MWp", "MWac"].includes(p.unit)) ? "selected" : ""}>${u}</option>`).join("")}</select></label><label class="field ${["MW", "MVA", "kms", "MWh", "MWp", "MWac"].includes(p.unit) ? "hidden" : ""}" id="custom-unit-field">Custom unit<input id="custom-unit" maxlength="30" value="${["MW", "MVA", "kms", "MWh", "MWp", "MWac"].includes(p.unit) ? "" : esc(p.unit)}" placeholder="Enter a unit"></label></div><fieldset style="border:0;padding:0;margin:0"><legend style="font-size:11px;margin-bottom:10px">Custom categories</legend><div class="choice-list">${customCategories.map((c) => `<label class="choice-chip"><input type="checkbox" name="project-custom-category" value="${esc(c)}" ${p.tags.includes(c) ? "checked" : ""} ${!state.admin ? "disabled" : ""}>${esc(c)}</label>`).join("")}</div></fieldset>${state.admin ? `<button class="button small" id="save-metadata" data-id="${id}">Save project information</button>` : ""}<h3 style="margin-top:25px;margin-bottom:10px">Project links</h3><a class="button small" href="https://example.com" target="_blank" rel="noopener noreferrer">${icon("link", 12)} Example project reference ${icon("arrow", 12)}</a><h3 style="margin-top:25px;margin-bottom:7px">Documents <span style="font-weight:400;color:var(--muted)">${p.files}</span></h3><p class="demo-file-label">Mockup only: filenames are illustrative. Selected files stay on your device; only their names appear in this preview.</p>${p.documents.map((d, i) => `<div class="document-row">${icon("file", 19)}<div>${esc(d.name)}<small>${esc(d.size)} · Preview record only</small></div>${state.admin ? `<button data-remove-file="${id}:${i}" aria-label="Remove ${esc(d.name)}">Remove</button>` : ""}</div>`).join("") || '<p style="font-size:11px;color:var(--muted);padding:15px 0">No files added yet. Add a sample document to try the review flow.</p>'}<div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap">${state.admin ? `<label class="button small" style="cursor:pointer">${icon("upload", 12)} Add sample file<input id="demo-file" data-id="${id}" type="file" style="display:none"></label><button class="button small primary" id="validate" data-id="${id}" ${!p.files ? "disabled" : ""}>${p.valid ? "Revoke validity" : "Mark project valid"}</button>` : ""}${badge(p)}</div><p class="demo-file-label">${p.valid ? "Reviewed by admin · Changing the document set returns this project to Needs review." : "Only an admin review marks a project valid. Stage completion is independent of document validity."}</p></div></div></section></div>`;
        document.getElementById("close-modal").focus();
      }
      function closeModal() {
        document.getElementById("modal-root").innerHTML = "";
        focusBeforeModal?.focus();
      }
      function refreshModal(id) {
        const scroll = document.querySelector(".modal")?.scrollTop || 0;
        openDetails(id);
        document.querySelector(".modal").scrollTop = scroll;
      }
      function navigate(page) {
        state.page = page;
        if (page === "portfolio") state.view = "table";
        if (page === "dashboard") state.view = "timeline";
        render();
        window.scrollTo({ top: 0, behavior: "instant" });
      }
      function exportCSV() {
        const rows = [
          [
            "Project ID",
            "Project name",
            "Category",
            "Capacity",
            "Capacity unit",
            "Start year",
            "Planned COD year",
            "Current stage",
            "Custom categories",
          ],
          ...filtered().map((p) => [
            p.id,
            p.name,
            p.category,
            p.capacity,
            p.unit,
            p.start,
            p.cod,
            p.stage || "",
            p.tags.join("; "),
          ]),
        ];
        const csv = rows
          .map((r) =>
            r.map((v) => '"' + String(v).replaceAll('"', '""') + '"').join(","),
          )
          .join("\r\n");
        const url = URL.createObjectURL(
          new Blob([csv], { type: "text/csv;charset=utf-8" }),
        );
        const a = document.createElement("a");
        a.href = url;
        a.download = "board-room-sample-projects.csv";
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        notify("Sample project CSV downloaded");
      }
      document.addEventListener("click", (e) => {
        const b = e.target.closest("button,a");
        if (!b) {
          if (e.target.id === "backdrop") closeModal();
          return;
        }
        if (b.dataset.customFilter) {
          state.custom = b.dataset.customFilter;
          state.view = "table";
          state.page = "portfolio";
          render();
          return;
        }
        if (b.dataset.view) {
          state.view = b.dataset.view;
          render();
          return;
        }
        if (b.dataset.docState) {
          state.valid =
            state.valid === b.dataset.docState ? "" : b.dataset.docState;
          render();
          return;
        }
        if (b.dataset.nav) {
          navigate(b.dataset.nav);
          return;
        }
        if (b.dataset.stage !== undefined) {
          toggleStage(+b.dataset.stage);
          return;
        }
        if (b.dataset.expand) {
          state.expanded =
            state.expanded === b.dataset.expand ? null : b.dataset.expand;
          preserveRender();
          return;
        }
        if (b.dataset.progress) {
          const [id, n] = b.dataset.progress.split(":");
          setProgress(id, +n);
          if (document.querySelector(".modal")) refreshModal(id);
          return;
        }
        if (b.dataset.reset) {
          setProgress(b.dataset.reset, 0);
          if (document.querySelector(".modal")) refreshModal(b.dataset.reset);
          return;
        }
        if (b.dataset.complete) {
          const p = projects.find((p) => p.id === b.dataset.complete);
          p.complete = true;
          preserveRender();
          notify("Project marked complete", () => {
            p.complete = false;
            render();
            notify("Completion undone");
          });
          if (document.querySelector(".modal")) refreshModal(p.id);
          return;
        }
        if (b.dataset.documents) {
          if (document.querySelector(".modal")) return;
          openDetails(b.dataset.documents);
          return;
        }
        if (b.dataset.yearBlock) {
          state.year =
            state.year === b.dataset.yearBlock ? "" : b.dataset.yearBlock;
          render();
          return;
        }
        if (b.dataset.year) {
          state.year = String(b.dataset.year);
          render();
          return;
        }
        if (b.dataset.sort) {
          state.ascending =
            state.sort === b.dataset.sort ? !state.ascending : true;
          state.sort = b.dataset.sort;
          render();
          return;
        }
        if (b.dataset.chartCategory) {
          state.category =
            state.category === b.dataset.chartCategory
              ? ""
              : b.dataset.chartCategory;
          render();
          return;
        }
        if (b.dataset.removeFile && state.admin) {
          const [id, index] = b.dataset.removeFile.split(":");
          const p = projects.find((p) => p.id === id);
          p.documents.splice(+index, 1);
          p.files = p.documents.length;
          p.valid = false;
          preserveRender();
          refreshModal(id);
          notify("Sample file removed; review status updated");
          return;
        }
        switch (b.id) {
          case "clear":
            Object.assign(state, {
              search: "",
              category: "",
              custom: "",
              valid: "",
              stage: null,
              year: "",
            });
            render();
            break;
          case "all-years":
            state.year = "";
            render();
            break;
          case "role":
            state.admin = !state.admin;
            render();
            notify(
              state.admin
                ? "Admin preview: editing enabled"
                : "Member preview: explore without editing",
            );
            break;
          case "expand-help":
            notify(
              "Select a timeline row to expand it. Select stage counts or charts to filter.",
            );
            break;
          case "valid-chart":
            state.valid = state.valid === "valid" ? "" : "valid";
            render();
            break;
          case "not-valid-chart":
            state.valid = state.valid === "not-valid" ? "" : "not-valid";
            render();
            break;
          case "close-modal":
            closeModal();
            break;
          case "undo":
            if (undoAction) {
              const f = undoAction;
              undoAction = null;
              f();
            }
            break;
          case "dismiss-toast":
            document.getElementById("toast").innerHTML = "";
            break;
          case "export":
            exportCSV();
            break;
          case "validate":
            if (state.admin) {
              const p = projects.find((p) => p.id === b.dataset.id);
              if (!p.files) return;
              p.valid = !p.valid;
              preserveRender();
              refreshModal(p.id);
              notify(
                p.valid
                  ? "Project reviewed and marked valid"
                  : "Validity revoked; project needs review",
              );
            }
            break;
          case "save-metadata":
            if (state.admin) {
              const p = projects.find((p) => p.id === b.dataset.id),
                input = document.getElementById("capacity"),
                unit = document.getElementById("capacity-unit").value;
              let actualUnit =
                unit === "custom"
                  ? document.getElementById("custom-unit").value.trim()
                  : unit;
              if (
                !input.value ||
                !Number.isFinite(+input.value) ||
                +input.value < 0
              ) {
                input.setCustomValidity("Enter a nonnegative capacity.");
                input.reportValidity();
                return;
              }
              if (!actualUnit) {
                document.getElementById("custom-unit").focus();
                notify("Enter a custom unit before saving");
                return;
              }
              input.setCustomValidity("");
              p.capacity = +input.value;
              p.unit = actualUnit;
              p.tags = [
                ...document.querySelectorAll(
                  'input[name="project-custom-category"]:checked',
                ),
              ].map((el) => el.value);
              preserveRender();
              refreshModal(p.id);
              notify("Sample project information updated");
            }
            break;
          case "preview-import":
            document.getElementById("modal-root").innerHTML =
              `<div class="modal-backdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><h2 id="modal-title">Review example import</h2><p class="subtitle">Illustrative preview · no import is performed</p></div><button class="button small" id="close-modal" aria-label="Close import preview">${icon("close", 14)}</button></div><div class="modal-body"><div class="notice">Match by Project ID. Keep existing project stages. Preserve projects absent from the file.</div><div style="display:flex;gap:40px;padding:10px 0 25px"><div><h1>2</h1><p>New projects</p></div><div><h1>1</h1><p>Updated</p></div><div><h1>15</h1><p>Unchanged</p></div></div><div class="table-wrap"><table><thead><tr><th>Project ID</th><th>Project</th><th>Change</th></tr></thead><tbody><tr><td>BR-019</td><td>PLTS Lombok Timur</td><td>New · 75 MWp · COD 2032</td></tr><tr><td>BR-020</td><td>GI Palu Barat</td><td>New · 60 MVA · COD 2031</td></tr><tr><td>BR-003</td><td>SUTT Kolaka–Lasusua</td><td>Capacity: 86 → 92 kms</td></tr></tbody></table></div><p class="subtitle">In the working app, you will map your CSV columns and confirm validated changes here.</p><button class="button primary" id="close-modal" style="margin-top:20px">Close sample preview</button></div></section></div>`;
            document.querySelector("#close-modal").focus();
            break;
        }
      });
      document.addEventListener("input", (e) => {
        if (e.target.id === "search") {
          const pos = e.target.selectionStart;
          state.search = e.target.value;
          render();
          const input = document.getElementById("search");
          input.focus();
          input.setSelectionRange(pos, pos);
        }
      });
      document.addEventListener("change", (e) => {
        const el = e.target;
        const map = {
          category: "category",
          custom: "custom",
          validation: "valid",
          year: "year",
        };
        if (map[el.id]) {
          state[map[el.id]] = el.value;
          render();
        }
        if (el.id === "capacity-unit")
          document
            .getElementById("custom-unit-field")
            .classList.toggle("hidden", el.value !== "custom");
        if (el.id === "demo-file" && state.admin) {
          const f = el.files[0];
          if (!f) return;
          const p = projects.find((p) => p.id === el.dataset.id);
          p.documents.push({ name: f.name, size: "Local filename only" });
          p.files = p.documents.length;
          p.valid = false;
          preserveRender();
          refreshModal(p.id);
          notify("Sample file added; admin review required");
        }
      });
      document.addEventListener("submit", (e) => {
        if (e.target.id === "category-form") {
          e.preventDefault();
          if (!state.admin) return;
          const name = document.getElementById("new-category").value.trim();
          if (!name) {
            notify("Enter a category name");
            return;
          }
          if (
            customCategories.some((c) => c.toLowerCase() === name.toLowerCase())
          ) {
            notify("That custom category already exists");
            return;
          }
          customCategories.push(name);
          render();
          notify("Custom category created; assign it in Project details");
          return;
        }
        if (e.target.id === "stage-form") {
          e.preventDefault();
          if (!state.admin) return;
          const data = new FormData(e.target),
            names = stageNames.map((_, i) =>
              String(data.get("stage-" + i)).trim(),
            );
          if (names.some((s) => !s)) {
            notify("All ten stages need a name");
            return;
          }
          stageNames = names;
          render();
          notify("Shared stage names updated for this preview");
        }
      });
      document.addEventListener("keydown", (e) => {
        const modal = document.querySelector(".modal");
        if (!modal) return;
        if (e.key === "Escape") {
          closeModal();
          return;
        }
        if (e.key === "Tab") {
          const els = [
              ...modal.querySelectorAll(
                "button:not(:disabled),a[href],input:not(:disabled),select:not(:disabled)",
              ),
            ].filter((el) => el.getClientRects().length),
            first = els[0],
            last = els[els.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }
      });
      render();
    </script>
    <script src="./board-room-features.js"></script>
    <script src="navigation.js"></script>
  </body>
</html>
